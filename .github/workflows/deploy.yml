name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH (Docker + Traefik)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          debug: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR=/root/Unified-Platforms-GTM-OS
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # The site runs as a Docker container behind the existing Traefik
            # reverse proxy (my.unifiedplatforms.com -> container port 3000).
            COMPOSE="docker compose"
            $COMPOSE version >/dev/null 2>&1 || COMPOSE="docker-compose"
            echo "==> Using: $COMPOSE ($(docker --version))"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            echo "==> Syncing code from origin/main (hard reset, no merge conflicts)..."
            if [ -d .git ]; then
              git remote set-url origin "$REPO_URL" || true
              git fetch origin main
              git reset --hard origin/main
            else
              git clone "$REPO_URL" .
            fi

            echo "==> Writing runtime environment (.env is git- and docker-ignored)..."
            cat > .env <<EOF
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            VITE_CHATBOT_MODEL=${{ secrets.VITE_CHATBOT_MODEL || 'gemini-flash-latest' }}
            APP_URL=${{ secrets.APP_URL }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            NODE_ENV=production
            EOF

            echo "==> Building image (npm ci + vite build happen inside Docker)..."
            $COMPOSE build --pull unified-platforms

            echo "==> Restarting container..."
            $COMPOSE up -d unified-platforms

            echo "==> Pruning dangling images..."
            docker image prune -f >/dev/null

            echo "==> Waiting for health (tsx cold start can take ~30s)..."
            docker ps --filter name=unified-platforms-app --format "{{.Names}} {{.Status}}"
            HEALTHY=""
            for i in $(seq 1 12); do
              if docker exec unified-platforms-app wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null; then
                HEALTHY=yes
                break
              fi
              sleep 5
            done
            if [ -z "$HEALTHY" ]; then
              echo "!! Health check failed after 60s — recent container logs:"
              docker logs --tail 50 unified-platforms-app
              exit 1
            fi
            echo ""
            echo "==> Deploy complete: https://my.unifiedplatforms.com"
